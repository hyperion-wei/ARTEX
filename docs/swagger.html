"integer","default":50}},{"name":"search","in":"query","required":false,"description":"按名称搜索,透传给上游","schema":{"type":"string"}}],"responses":{"200":{"description":"项目列表与标签计数","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ScopeSentryProjectsResponse"}}}},"500":{"description":"读取 MCP 配置失败","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"502":{"description":"数据源不存在/未配置/未启用,上游调用失败或响应解析失败","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"503":{"description":"数据库未连接","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/sync/scopesentry/tasks":{"get":{"tags":["sync"],"summary":"拉取 ScopeSentry 任务列表","description":"调用上游 ScopeSentry MCP 的 list_tasks 工具分页拉取任务,取 list 数组原样透传(字段结构以上游为准)。search 非空时透传给上游。需要数据源已配置并启用,否则返回 502。整次调用 60 秒超时。","operationId":"listScopeSentryTasks","parameters":[{"name":"page","in":"query","required":false,"description":"页码,默认 1(<=0 回落 1)","schema":{"type":"integer","default":1}},{"name":"size","in":"query","required":false,"description":"每页条数,默认 50(<=0 回落 50)","schema":{"type":"integer","default":50}},{"name":"search","in":"query","required":false,"description":"按名称搜索,透传给上游","schema":{"type":"string"}}],"responses":{"200":{"description":"任务列表","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ScopeSentryTasksResponse"}}}},"500":{"description":"读取 MCP 配置失败","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"502":{"description":"数据源不存在/未配置/未启用,上游调用失败或响应解析失败","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"503":{"description":"数据库未连接","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/sync/scopesentry/sync":{"post":{"tags":["sync"],"summary":"执行 ScopeSentry 资产同步","description":"按 project(项目 ObjectID)或 task(任务名)维度拉取资产并映射入库:subdomain(连带其解析 IP 一并入库)、ap ,page_size}。带 task 参数:读取该任务的探索节点视图并附加来源任务继承的只读发现(inherited=true),始终返回裸数组。筛选/排序统一下推 SQL:severity/status/vulnclass/task_id/q/asset_scope 为筛选参数,sort=severity 按严重度加权降序,其余(含缺省)最新优先。筛选值 all 或空表示不过滤;task_id 还支持 __unassigned__(无任务或任务已删)。","operationId":"listFindings","parameters":[{"name":"task","in":"query","required":false,"schema":{"type":"string"},"description":"数字任务 ID 或 active;不传=全局发现页(独立 findings 表)"},{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":1,"default":1},"description":"页码(1 起);携带 page 或 limit 任一即启用分页响应"},{"name":"limit","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":200,"default":20},"description":"每页条数,默认 20,上限 200"},{"name":"severity","in":"query","required":false,"schema":{"type":"string","enum":["all","critical","high","medium","low"]},"description":"严重度筛选;all/空=不过滤"},{"name":"status","in":"query","required":false,"schema":{"type":"string","enum":["all","pending","in_progress","confirmed","resolved","fixed","false_positive","ignored","duplicate","risk_accepted"]},"description":"处理状态筛选;all/空=不过滤"},{"name":"vulnclass","in":"query","required":false,"schema":{"type":"string"},"description":"漏洞类型精确筛选;all/空=不过滤"},{"name":"task_id","in":"query","required":false,"schema":{"type":"string"},"description":"按任务筛选(数字任务 ID);__unassigned__=无任务或任务已删;all/空=不过滤"},{"name":"q","in":"query","required":false,"schema":{"type":"string"},"description":"关键词模糊检索(名称/类型/摘要/证据/报告正文,ILIKE 字面匹配)"},{"name":"sort","in":"query","required":false,"schema":{"type":"string"},"description":"排序:severity=按严重度降序(critical>high>medium>low)再按时间;其他值或缺省=最新优先"},{"name":"asset_scope","in":"query","required":false,"schema":{"type":"string"},"description":"资产树节点 key(a:<资产id>/c:<公司id>/r:<根域名>/__none__),选中节点等于选中其整棵子树;空=不按资产筛选"}],"responses":{"200":{"description":"无分页参数或按任务查询时返回 Finding 裸数组;带分页参数时返回 {items,total,page,page_size}","content":{"application/json":{"schema":{"oneOf":[{"type":"array","items":{"$ref":"#/components/schemas/Finding"}},{ rity":[{"bearerAuth":[]}]},"post":{"tags":["findings"],"summary":"发起漏洞复测","description":"为漏洞创建复测会话(retester Agent 驱动)。notes 为可选补充说明(≤4000 字符),会随首条消息交给复测 Agent;请求体上限 64KB。若该漏洞已有进行中(pending/running)的复测,直接返回现有记录且不重复派发(created=false,200);新创建并已派发会话时返回 202(created=true)。前置条件:retester Agent 已存在且启用、已绑定 get_finding_retest_context / record_finding_retest_result 工具、复测会话 LLM 可用,否则 409/503。会话成功结束且结论为 fixed 时系统自动将漏洞状态改为已修复。","operationId":"startFindingRetest","parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"integer","format":"int64","minimum":1},"description":"漏洞 ID(独立 findings 表 id)"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/FindingRetestStartRequest"}}}},"responses":{"200":{"description":"返回已存在的进行中复测(created=false)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/FindingRetestStartResult"}}}},"202":{"description":"已创建并派发新复测会话(created=true)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/FindingRetestStartResult"}}}},"400":{"description":"id 非法 / JSON 解析失败 / notes 超过 4000 字符","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"漏洞不存在","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"复测 Agent 不存在或未启用,或所需工具未启用/未绑定","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"413":{"description":"请求正文超过 64KB","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"500":{"description":"数据库错误","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"503":{"description":"复测会话 LLM 不可用 / PostgreSQL 未连接 / 服务正在停止","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/exploration/findings/retests/active":{"get":{"tags":["findings"],"summary":"进行中的漏洞复测","description":"全局列出状态为 pending/running 的复测,仅返回小载荷(id/finding_id/conversation_id/status),供发现列表轮询复测进行中徽标。finding_id 与发现 API 一致使用字符串形式。","operationId":"listActiveFindingRetests","responses":{"200":{"description":"进行中的复测列表(可为空数组)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActiveFindingRetestListResult"}}}},"500":{"description":"数据库错误","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"503":{"description":"PostgreSQL 数据源未连接","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/exploration/intents":{"get":{"tags":["exploration"],"summary":"意图列表","description":"任务的探索意图(方向)节点,按 id 倒序。不带 before/page 时保持兼容的裸数组响应(limit 默认 300,上限 500);携带 before=<节点 id>(或 page 作为标记)时返回 {items,has_more} 分页形式,可向上滚动翻页越过旧的固定 300 条边界。分页形式还合并直接来源任务中已终态(done/blocked/exhausted/stopped)意图的不可变结果(标记 inherited/source_task_id),这些行不参与本任务的 frontier 与领取。","operationId":"listIntents","parameters":[{"name":"task","in":"query","required":false,"schema":{"type":"string"},"description":"数字任务 ID 或 active;任务不存在时返回空数组(裸数组形式)"},{"name":"limit","in":"query","required":false,"schema":{"type":"integer","default":300,"maximum":500},"description":"返回条数,默认 300,上限 500"},{"name":"before","in":"query","required":false,"schema":{"type":"integer","format":"int64"},"description":"分页游标:上一页最旧一条的节点 id,仅返回 id 更小的记录;携带后切换为分页响应"},{"name":"page","in":"query","required":false,"schema":{"type":"integer"},"description":"仅作为启用分页模式的标记(与 before 等效触发分页响应)"}],"responses":{"200":{"description":"裸数组(TaskNode[])或分页对象 {items,has_more}","content":{"application/json":{"schema":{"oneOf":[{"type":"array","items":{"$ref":"#/components/schemas/TaskNode"}},{"$ref":"#/components/schemas/IntentPage"}]}}}},"500":{"description":"数据库错误","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/exploration/graph":{"get":{"tags":["exploration"],"summary":"探索图(节点+边)","description":"返回任务完整探索链(任务图):nodes 上限 2000、edges 上限 5000,并合并直接来源任务的不可变快照(仅暴露已终态意图及 {"description":"节点分页结果(含相关边、邻居 refs 与锚定资产)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ExplorationNodesPage"}}}},"500":{"description":"数据库错误","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/exploration/activity":{"get":{"tags":["exploration"],"summary":"活动流(增量轮询)","description":"Worker 执行步骤日志,以 ?since=<seq> 增量拉取(返回 id 大于 since 的记录),响应 cursor 作为下次 since,实现历史+实时无缝衔接。可带 intent=<节点 id> 限定单个 Worker 会话(含来源任务继承的已终态意图步骤)。limit 默认 300。任务不存在时返回空 {items:[],cursor:0}。列表响应 detail 字段为空(懒加载,用 /activity/{seq} 取)。会话历史翻页请用 /activity/history。","operationId":"listActivity","parameters":[{"name":"task","in":"query","required":false,"schema":{"type":"string"},"description":"数字任务 ID 或 active"},{"name":"since","in":"query","required":false,"schema":{"type":"integer","format":"int64","default":0},"description":"增量游标:仅返回 id 大于该值的活动,默认 0(从头)"},{"name":"limit","in":"query","required":false,"schema":{"type":"integer","default":300},"description":"返回条数上限,默认 300"},{"name":"intent","in":"query","required":false,"schema":{"type":"integer","format":"int64"},"description":"意图节点 id;限定为该 Worker 会话的活动(含继承终态意图)"}],"responses":{"200":{"description":"活动列表与增量游标","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActivityPage"}}}},"500":{"description":"数据库错误","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/exploration/activity/history":{"get":{"tags":["exploration"],"summary":"活动历史(会话反向分页)","description":"按会话读取一页活动历史(新→旧)。session 取值:main=当前主 Agent 段;main:<seg>=指定段;plan=Planner 会话;intent:<节点 id>=Worker 会话(继承的意图会话只在终态可读,且剔除模型推理/计费行)。不带 before 返回最新一页(打开会话),带 before=<活动 id> 继续向上翻更旧的页。snapshot_cursor=查询时刻任务级活动最大 id,客户端用它以 since=snapshot_cursor 打开任务级 SSE,使历史(id≤cursor)与实时尾随(id>cursor)无缝衔接;earliest_cursor=本页最早活动 id。limit 默认 200、上限 500。task 必填:任务不存在 404;session 格式非法 400;会话(意图)不存在 404。","operationId":"listActivityHistory","parameters":[{"name":"task","in":"query","required":true,"schema":{"type":"string"},"description":"数字任务 ID 或 active(必填)"},{"name":"session","in":"query","required":false,"schema":{"type":"string"},"description":"会话键:main(默认当前段)/ main:<seg> / plan / intent:<节点 id>"},{"name":"before","in":"query","required":false,"schema":{"type":"integer","format":"int64","default":0},"description":"分页游标:仅返回 id 小于该值的活动;0=最新一页"},{"name":"limit","in":"query","required":false,"schema":{"type":"integer","default":200,"maximum":500},"description":"每页条数,默认 200,上限 500"}],"responses":{"200":{"description":"会话历史页(含快照游标与翻页信息)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActivityHistoryPage"}}}},"400":{"description":"session 格式非法","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"任务不存在或会话(意图)不存在","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"500":{"description":"数据库错误","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/exploration/activity/stream":{"get":{"tags":["exploration"],"summary":"活动实时流(SSE)","description":"任务级活动实时尾随(text/event-stream)。流程:先分批(每批 500)补放 DB 中 id 大于 since 的积压,再订阅实时广播持续推送。每条事件形如「id: <seq>\\ndata: <ActivityEvent JSON>\\n\\n」,id 行供浏览器断线自动重连时回传 Last-Event-ID(优先级高于 since 查询参数,保证从断点精确续传);每 20 秒发送「: ping」注释行保活。可选 intent=<节点 id> 限定单 Worker 会话。补放查询出错时服务端直接关闭连接,客户端应重连并从最后 id 重试(广播有损,DB 是事实来源)。任务不存在 404。","operationId":"streamActivity","parameters":[{"name":"task","in":"query","required":true,"schema":{"type":"string"},"description":"数字任务 ID 或 active(必填)"},{"name":"since","in":"query","required":false,"schema":{"type":"integer","format":"int64","default":0},"description":"起始游标:先补放 id 大于该值的历史活动;浏览器自动重连时会被 Last-Event-ID 覆盖"},{"name":"intent","in":"query","required":false,"schema":{"type":"integer","format":"int64"},"description":"意图节点 id;限定为该 Worker 会话的活动"},{"name":"Last-Event-ID","in":"header","required":fal ":{"application/json":{"schema":{"$ref":"#/components/schemas/LLMProfileInput"}}}},"responses":{"200":{"description":"保存成功,返回档案 ID","content":{"application/json":{"schema":{"type":"object","required":["id"],"properties":{"id":{"type":"integer","format":"int64","description":"档案 ID(新建返回新 id,更新返回原 id)"}}}}}},"400":{"description":"请求体不是合法 JSON 或违反数据库约束(如 name 重复、format 非法)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"500":{"description":"数据库写入失败","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"503":{"description":"管理后台数据源(PostgreSQL)未连接","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/llm/profiles/{id}":{"delete":{"tags":["llm-profiles"],"summary":"删除 LLM 配置档案","description":"删除非激活状态的 LLM profile;激活中的档案不能删(409,需先切换激活)。删除在事务内锁定并迁移任务/agent/会话引用、保留任务轮询游标;期间引用被并发修改会在有限次重试后返回 409,等待释放超时(上限 15 秒)同样 409。删除成功后失效对应 agent 缓存与熔断状态、同步任务 LLM 状态并重放激活配置,受影响任务中因配额阻塞的意图会被重开。","operationId":"deleteLLMProfile","parameters":[{"name":"id","in":"path","required":true,"description":"档案 ID","schema":{"type":"integer","format":"int64"}}],"responses":{"200":{"description":"删除成功,返回被删除的档案 ID","content":{"application/json":{"schema":{"type":"object","required":["deleted"],"properties":{"deleted":{"type":"integer","format":"int64","description":"被删除的档案 ID"}}}}}},"404":{"description":"档案不存在","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"激活中的档案不能删除 / 档案引用正被任务或会话修改 / 等待引用释放超时","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"500":{"description":"数据库删除失败","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"503":{"description":"管理后台数据源(PostgreSQL)未连接","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/llm/profiles/active":{"post":{"tags":["llm-profiles"],"summary":"切换激活的 LLM 配置","description":"把指定 profile 设为全局激活(恒为故障转移链链首),并立即热切换运行中引擎的 provider;失效 agent 缓存后重放激活配置,使全局兜底与任务显式链共享同一限流器。显式绑定其他档案的任务不受影响,但其兜底链随之变化。","operationId":"activateLLMProfile","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["id"],"properties":{"id":{"type":"integer","format":"int64","description":"要激活的档案 ID"}}}}}},"responses":{"200":{"description":"激活成功","content":{"application/json":{"schema":{"type":"object","required":["ok"],"properties":{"ok":{"type":"boolean"}}}}}},"400":{"description":"请求体不是合法 JSON","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"500":{"description":"数据库写入失败","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"503":{"description":"管理后台数据源(PostgreSQL)未连接","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/llm/retry-policy":{"get":{"tags":["llm"],"summary":"获取全局 LLM 重试策略","description":"返回五层重试(建连 / 空响应 / 断流 / 熔断 / 意图重跑)的全局次数与间隔配置。从未配置过时各字段为 0,即全部走内置默认(前端把 0 显示为「默认」)。","operationId":"getLLMRetryPolicy","responses":{"200":{"description":"全局重试策略","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LLMRetryPolicy"}}}},"503":{"description":"管理后台数据源(PostgreSQL)未连接","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]},"post":{"tags":["llm"],"summary":"保存全局 LLM 重试策略","description":"保存全局重试策略(存 settings 表单个 JSON 键),越界值自动夹取:attempts 限 [-1,20],interval_ms 限 [0,3600000]。保存后立即热应用——建连/空响应/断流参数是 provider 的构建参数,会失效并重建缓存中的 provider、重放激活档案;熔断参数直接推给进程级 Registry。返回夹取后的最终策略。","operationId":"saveLLMRetryPolicy","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LLMRetryPolicy"}}}},"responses":{"200":{"description":"保存成功,返回夹取后的最终策略","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LLMRetryPolicy"}}}},"400":{"description":"请求体不是合法 JSON","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"500":{"description":"数据库写入失败","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"503":{"description":"管理后台数据源(PostgreSQL)未连接","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/llm/pool":{"get":{"tags":["llm"],"summary":"LLM 轮询池状态","description":"返回故障转移(轮询)总开关与绑定兜底开关、解析后的链路顺序(激活档案恒为链首,其余按 priority 降序、id 升序)以及每个 profile 的熔断健康状态(state 为 ok / degraded(有失败未熔断)/ tripped(已熔断)、连续失败数、熔断次数、剩余冷却秒数)。被 pool_exclude 排除的档案同样列出并标记,便于理解其为何不在链上。","operationId":"getLLMPoolStatus","responses":{"200":{"description":"轮询池状态","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LLMPoolStatus"}}}},"503":{"description":"管理后台数据源(PostgreSQL)未连接","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/llm/pool/reset":{"post":{"tags":["llm"],"summary":"重置 LLM 熔断状态","description":"清除已触发熔断的 profile 断路器,使下一次调用立即重试(「立即恢复」)。id 为 0 或省略=重置全部 profile。返回重置后的完整池状态(同 GET /api/llm/pool)。","operationId":"resetLLMPoolBreaker","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"id":{"type":"integer","format":"int64","description":"要重置的档案 ID;0 或省略=重置全部"}}}}}},"responses":{"200":{"description":"重置完成,返回当前池状态","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LLMPoolStatus"}}}},"400":{"description":"请求体不是合法 JSON","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"503":{"description":"管理后台数据源(PostgreSQL)未连接","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/llm/models":{"post":{"tags":["llm"],"summary":"拉取可用模型列表","description":"由服务端转发调用 provider 的模型列表端点,注意这是同步外呼且可能耗时(客户端超时 30 秒,响应体最大读取 4MB)。openai / openai-responses 走 {base_url}/models(Bearer 鉴权,兼容完整 endpoint URL,默认 https://api.openai.com/v1);anthropic 走 {base_url}/v1/models(x-api-key + anthropic-version 头,默认 https://api.anthropic.com),若 base_url 以 /anthropic 结尾还会按顺序回退尝试其根路径的 OpenAI 端点(DeepSeek 等 Anthropic 兼容第三方把模型列表只放在 OpenAI 路径)。API Key 解析:表单 api_key > profile_id 指定档案存储的 key。无 key 或所有候选端点均失败时仍返回 200,以 ok=false + error 表达;某端点 200 但列表为空会继续尝试其余候选。","operationId":"listLLMModels","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LLMModelsRequest"}}}},"responses":{"200":{"description":"模型列表或失败原因(ok=false 时带 error)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LLMModelsResult"}}}},"400":{"description":"请求体不是合法 JSON","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/chat":{"post":{"tags":["chat"],"summary":"向任务主 Agent 发送消息","description":"向指定任务的主 Agent(编排会话)发送一条用户消息。这不是 SSE 接口:LLM 可用时立即返回 202,消息交给后台 goroutine 执行(可运行数分钟的多工具循环),过程步骤(thinking/tool_use/tool_result/text/result)以 worker=mainagent 流入任务活动流,前端通过任务活动 SSE(GET /api/exploration/activity/stream)实时观看,最终答案是一条 kind=result 的活动;LLM 不可用时同步执行规则模式并直接返回 200(态势摘要,支持「意图 ...」/「提示 ...」指令)。任务暂停(paused)不会拦截该对话。同一任务同时只允许一条在途消息(409)。消息里的 @[(漏洞|资产|企业|接口|IP|应用|域名|子域名|服务)#ID 标签]会在服务端展开为所引用记录的 JSON 快照,单条消息最多引用 10 条,引用记录不存在时整条请求被拒绝。","operationId":"sendTaskChat","parameters":[{"name":"task","in":"query","required":true,"description":"目标任务 ID(数字字符串)","schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ChatTurnRequest"}}}},"responses":{"200":{"description":"规则模式(LLM 未配置):同步返回回复","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ChatRuleReply"}}}},"202":{"description":"LLM 模式:请求已受理,回合在后台执行,过程与结果经任务活动流(SSE)返回","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ChatTurnAccepted"}}}},"400":{"description":"请求体不是合法 JSON,或消息中的引用(@[..#ID])格式/记录无效","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"task 参数指定的任务不存在或未激活","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"任务正在删除,或主 Agent 正在处理上一条消息","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"security":[{"bearerAuth":[]}]}},"/api/chat/upload":{"post":{"tags":["chat"],"summary":"上传聊天附件","description":"把一个或多个文件上传到聊天的工作目录 uploads/ 子目录下,使 Agent 能用现有的 Read/Bash 工具直接打开(无多模态)。同名文件自动追加 -1/-2... 后缀避免覆盖。scope=task 落到 <workDir>/tasks/<id>/uploads/;scope=session 落到 <workDir>/sessions/<id>/uploads/(会话 id 形如 conv-<数字>);scope=staging 落到 <workDir>/drafts/<id>/uploads/(建任务前暂存,任务尚无 ID)。id 只允许字母数字/下划线/连字符。单次请求体上限 128 MiB,内存缓冲 32 MiB 后落盘。scope=task 时任务不存在返回 404,任务正在删除返回 409。","operationId":"uploadChatFile","parameters":[{"name":"scope","in":"query","required":true,"description":"上传目标范围","schema":{"type":"string","enum":["task","session","staging"]}},{"name":"id","in":"query","required":true,"description":"目标 ID:scope=task 时为任务数字 ID;scope=session 时为会话 session ID(如 conv-12);scope=staging 时为前端自拟的草稿 ID。仅允许 [A-Za-z0-9_-]","schema":{"type":"string"}}],"requestBody":{"required":true,"description":"multipart 表单,字段名 file,可重复出现(一次传多个文件)。单次请求总大小上限 128 MiB","content":{"multipart/form-data":{"schema":{"type":"object","required":["file"],"properties":{"file":{"type":"array","description":"上传的文件(可重复字段)","items":{"type":"string","format":"binary"}}}}}}},"responses":{"200":{"description":"上传成功,返回附件清单","content":{"application/json":{"schema":{"type":"object","required":["attachments"],"properties":{"attachments":{"type":"array","items":{"$ref":"#/components/schemas/ChatAttachment"}}}}}}},"400":{"description":"scope 无效、id 非法、缺少 file 字段、解析失败或超出大小限制","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"scope=task 时任务不存在","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"scope=task 时任务正在删除,无法上传附件","content":{"application/json":{"schema":{"$re
